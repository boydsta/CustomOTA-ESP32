paragraph=Over-The-Air update library for ESP32 with automatic backup detection, dual partition rollback, filesystem (SPIFFS) updates, modern drag & drop web interface, real-time progress tracking, optional HTTP authentication, heap monitoring, enhanced rollback validation, configurable restart delays, safer SPIFFS handling, debug control system, and enhanced rollback functionality. Features automatic detection of firmware in inactive partitions, perfect for serial upload → OTA workflow. Designed for real-time applications with non-blocking operations and comprehensive error handling.
