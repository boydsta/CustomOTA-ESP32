; CustomOTA test project - partition table rewrite test (v2 partition editor, step 0)
;
; Serial commands at 115200:
;   p  print the partition table and check that it rebuilds byte-for-byte
;   w  rewrite the same partition table through CustomOTAPartitions::write()
;   r  restart
;
; Pass: after 'w' then 'r', the device boots and 'p' shows the same table.
; Recovery if it does not boot: pio run -t upload (rewrites bootloader, table and app).

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
lib_deps =
	mathieucarbou/AsyncTCP@^3.2.3
	mathieucarbou/ESPAsyncWebServer@^3.1.1
	symlink://../
build_flags =
	-D CUSTOM_OTA_DEBUG=1
	-D CUSTOM_OTA_PARTITIONS=1

; Arduino 2.0.17 / ESP-IDF 4.4 - the core used by older projects
[env:esp32dev-idf44]
extends = env:esp32dev
platform = espressif32@6.10.0
