name: Feature Request
description: Suggest an idea for CustomOTA
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible.

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: Describe the feature you'd like to see added
      placeholder: A clear and concise description of what you want to happen
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when...
    validations:
      required: false

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like
      placeholder: How would you like this feature to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe alternatives you've considered
      placeholder: What other approaches have you thought about?
    validations:
      required: false

  - type: dropdown
    id: feature-complexity
    attributes:
      label: Feature Complexity
      description: How complex do you think this feature would be to implement?
      options:
        - Simple (minor changes to existing code)
        - Moderate (new functionality, some refactoring)
        - Complex (major changes, new architecture)
        - Not sure
    validations:
      required: false

  - type: checkboxes
    id: real-time-compatibility
    attributes:
      label: Real-Time Compatibility
      description: Consider the real-time requirements
      options:
        - label: This feature must maintain real-time compatibility (no delay() calls)
        - label: This feature may involve blocking operations
        - label: This feature is not related to real-time operations

  - type: checkboxes
    id: backward-compatibility
    attributes:
      label: Backward Compatibility
      description: Consider existing users
      options:
        - label: This feature should be backward compatible
        - label: This feature may require breaking changes
        - label: Not sure about compatibility impact

  - type: textarea
    id: use-cases
    attributes:
      label: Use Cases
      description: Describe specific use cases where this feature would be helpful
      placeholder: |
        1. When developing IoT devices...
        2. For production deployments...
        3. During testing and debugging...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples about the feature request
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you interested in contributing?
      options:
        - label: I would be willing to implement this feature
        - label: I would be willing to test this feature
        - label: I would provide feedback during development
