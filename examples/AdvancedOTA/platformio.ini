[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; CRITICAL: CustomOTA requires dual OTA partitions!
; Copy ../../partitions/default.csv to your project root and use:
board_build.partitions = ../../partitions/default.csv

lib_deps = 
	mathieucarbou/AsyncTCP@^3.2.3
	mathieucarbou/ESPAsyncWebServer@^3.1.1
	; Use local library for development
	file://../../

build_flags = 
	-D CUSTOM_OTA_DEBUG=1
